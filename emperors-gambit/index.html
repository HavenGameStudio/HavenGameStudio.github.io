<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#0b0a10">
    <title>EmperorsGambit Fog of War</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
  </head>
  <body>
    <div id="unity-container">
      <canvas id="unity-canvas" tabindex="-1"></canvas>
      <div id="unity-loading-bar">
        <div id="unity-logo"></div>
        <div id="unity-progress-bar-empty">
          <div id="unity-progress-bar-full"></div>
        </div>
      </div>
      <div id="unity-warning"> </div>
    </div>
    <script>
      // Emperor's Gambit is laid out for portrait screens. Phones fill the screen; desktop and landscape
      // windows get a centred portrait column so the UI and board keep the proportions they were built for.
      var MIN_ASPECT = 9 / 21; // tallest supported shape (width / height)
      var MAX_ASPECT = 9 / 16; // widest supported shape

      var container = document.querySelector("#unity-container");
      var canvas = document.querySelector("#unity-canvas");

      function layoutCanvas() {
        var viewportWidth = window.innerWidth;
        var viewportHeight = window.innerHeight;
        var aspect = Math.min(Math.max(viewportWidth / viewportHeight, MIN_ASPECT), MAX_ASPECT);

        var width = viewportWidth;
        var height = viewportWidth / aspect;
        if (height > viewportHeight) {
          height = viewportHeight;
          width = height * aspect;
        }

        container.style.width = Math.floor(width) + "px";
        container.style.height = Math.floor(height) + "px";
      }

      layoutCanvas();
      window.addEventListener("resize", layoutCanvas);
      window.addEventListener("orientationchange", layoutCanvas);

      // Long-press on mobile would otherwise open the browser's context menu over the board.
      canvas.addEventListener("contextmenu", function (event) { event.preventDefault(); });

      // Shows a temporary message banner for a few seconds, or a permanent error message if type == 'error'.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: #b3261e; color: white; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: #f2c94c; padding: 10px;';
          setTimeout(function () {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      // Filled in by Tools > Emperor's Gambit > Build WebGL (Release) when an ASTC data file ships next to the
      // default DXT one. Desktop GPUs use DXT, phones use ASTC; the wrong one is decompressed on the CPU at load.
      var ASTC_DATA_FILENAME = "";

      function supportsAstc() {
        try {
          var probe = document.createElement("canvas");
          var gl = probe.getContext("webgl2") || probe.getContext("webgl");
          if (!gl) return false;
          var supported = !!gl.getExtension("WEBGL_compressed_texture_astc");
          var loseContext = gl.getExtension("WEBGL_lose_context");
          if (loseContext) loseContext.loseContext();
          return supported;
        } catch (e) {
          return false;
        }
      }

      var dataFile = ASTC_DATA_FILENAME && supportsAstc() ? ASTC_DATA_FILENAME : "d8ea459fd08449ea91800113499319d2.data.unityweb";

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/b72d7565980b642046a479b4aa1e3f37.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/" + dataFile,
        frameworkUrl: buildUrl + "/0197df57d1202670660e76e87c80fb5d.framework.js.unityweb",
        codeUrl: buildUrl + "/62b02e472b191acbedd9724738d06a26.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "HavenGameStudio",
        productName: "EmperorsGambit Fog of War",
        productVersion: "1.1a",
        showBanner: unityShowBanner,
        // Phones report a devicePixelRatio of 3 or more. Rendering at that density costs a lot of GPU time
        // for little visible gain on a board game, so it is capped.
        devicePixelRatio: Math.min(window.devicePixelRatio || 1, 2),
      };

      document.querySelector("#unity-loading-bar").style.display = "block";

      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = function () {
        createUnityInstance(canvas, config, function (progress) {
          document.querySelector("#unity-progress-bar-full").style.width = 100 * progress + "%";
        }).then(function (unityInstance) {
          document.querySelector("#unity-loading-bar").style.display = "none";
        }).catch(function (message) {
          unityShowBanner(message, 'error');
        });
      };

      document.body.appendChild(script);
    </script>
  </body>
</html>
